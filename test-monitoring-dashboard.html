<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Delivery Ops — Release Assurance</title>
<style>
:root{
  --ground:#0B111F; --panel:#141C2F; --panel-2:#1A2440; --panel-3:#202C4C; --hair:#263353;
  --ink:#EAEFF8; --ink-2:#9FAEC9; --ink-3:#63718F;
  --pass:#2FD39A; --fail:#FF5470; --warn:#F5B23C; --run:#5B8CFF;
  --agent:#00D6BE; --gold:#F1C14B; --violet:#9B87D8; --cyan:#38D6F0;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  --sans:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:
  radial-gradient(1200px 600px at 80% -10%,rgba(0,214,190,.06),transparent 60%),
  radial-gradient(900px 500px at -5% 10%,rgba(91,140,255,.06),transparent 55%),
  var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px;border-radius:3px}

.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.rail{background:linear-gradient(180deg,var(--panel),rgba(20,28,47,.6));border-right:1px solid var(--hair);padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--agent),var(--run));display:grid;place-items:center;color:#06131A;font-weight:800;font-size:11px;box-shadow:0 4px 14px rgba(0,214,190,.35)}
.brand h1{font-size:13px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:1px 0 0;font-size:10.5px;color:var(--ink-3)}
.field{display:block;margin-bottom:10px}
.field span{display:block;margin-bottom:5px}
select{width:100%;background:var(--panel-2);border:1px solid var(--hair);color:var(--ink);padding:7px 8px;border-radius:6px;font-size:12px;font-family:var(--mono)}
select:disabled{opacity:.5}
.railcard{background:var(--panel-2);border:1px solid var(--hair);border-radius:8px;padding:11px 12px}
.railcard .eyebrow{margin-bottom:7px}
.rrow{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px;color:var(--ink-2)}
.rrow:last-child{margin-bottom:0}
.rrow b{color:var(--ink);font-weight:600}
.live{color:var(--pass);font-size:11.5px;display:flex;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--pass);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.mininote{font-size:10.5px;color:var(--ink-3);line-height:1.55;margin-top:auto;border-top:1px solid var(--hair);padding-top:12px}
.mininote b{color:var(--agent)}

.main{padding:20px 26px 44px;min-width:0}
.crumb{font-size:11px;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb b{color:var(--ink-2);font-weight:600}
.crumb .sep{color:var(--hair)}
.verdict{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.verdict h2{margin:3px 0 6px;font-size:23px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.verdict h2 em{font-style:normal}
.verdict p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:76ch}
.stamp{border:1px solid var(--fail);color:var(--fail);padding:8px 14px;border-radius:8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;white-space:nowrap;background:rgba(255,84,112,.06)}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:18px}
.kpi{background:linear-gradient(180deg,var(--panel),rgba(20,28,47,.55));border:1px solid var(--hair);border-radius:10px;padding:13px 14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--accent,var(--agent));opacity:.85}
.kpi .cap{position:absolute;right:11px;top:11px;font-size:9px;font-weight:700;letter-spacing:.04em}
.kpi b{display:block;font-size:20px;font-weight:750;margin-top:6px}
.kpi small{display:block;color:var(--ink-3);font-size:10px;margin-top:2px}
.gold{color:var(--gold)}.tealc{color:var(--agent)}.passc{color:var(--pass)}.warnc{color:var(--warn)}.failc{color:var(--fail)}.runc{color:var(--run)}.violetc{color:var(--violet)}.cyanc{color:var(--cyan)}
.port-tag{background:rgba(241,193,75,.14);color:var(--gold);font-size:8.5px;padding:1.5px 6px;border-radius:9px;letter-spacing:.05em;font-weight:700}

.ladder{display:flex;gap:5px;margin-bottom:20px}
.gate{flex:1;min-width:0;background:linear-gradient(180deg,var(--panel),rgba(20,28,47,.5));border:1px solid var(--hair);border-radius:9px;padding:11px 12px;text-align:left;position:relative;overflow:hidden;transition:border-color .15s,transform .12s;cursor:pointer}
@media (prefers-reduced-motion:reduce){.gate{transition:none}}
.gate:hover{transform:translateY(-2px)}
.gate[aria-pressed="true"]{border-color:var(--agent)}
.gate .bar{position:absolute;left:0;top:0;height:100%;width:4px}
.g-pass .bar{background:var(--pass)}.g-fail .bar{background:var(--fail)}.g-warn .bar{background:var(--warn)}.g-block .bar{background:var(--violet)}.g-pending .bar{background:var(--ink-3)}
.gate .seq{font-size:9px;color:var(--ink-3);font-family:var(--mono)}
.gate .gn{font-size:12.5px;font-weight:700;margin:3px 0 8px;padding-left:2px}
.gate .st{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.g-pass .st{color:var(--pass)}.g-fail .st{color:var(--fail)}.g-warn .st{color:var(--warn)}.g-block .st{color:var(--violet)}.g-pending .st{color:var(--ink-3)}
.gate .meta{font-size:10px;color:var(--ink-3);margin-top:7px;font-family:var(--mono)}
.gate .chev{position:absolute;right:8px;top:10px;color:var(--ink-3);font-size:12px}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--hair);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--agent)}
.filterchip{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--hair);border-radius:20px;padding:4px 12px;margin-bottom:14px}
.filterchip button{color:var(--ink-3);font-size:14px;line-height:1}

.panel{background:linear-gradient(180deg,var(--panel),rgba(20,28,47,.5));border:1px solid var(--hair);border-radius:11px;overflow:hidden}
.panel-hd{padding:13px 16px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-hd h3{margin:0;font-size:13px;font-weight:700}
.slo{font-size:10.5px;color:var(--ink-3)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--hair);white-space:nowrap}
th.r,td.r{text-align:right}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--ink-2)}
td{padding:11px 16px;border-bottom:1px solid rgba(38,51,83,.5);font-size:12.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}tbody tr.clickable:hover{background:var(--panel-2)}
.mono{font-family:var(--mono)}
.tag{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;padding:2.5px 7px;border-radius:4px;white-space:nowrap}
.t-pass{background:rgba(47,211,154,.15);color:var(--pass)}
.t-fail{background:rgba(255,84,112,.15);color:var(--fail)}
.t-warn{background:rgba(245,178,60,.16);color:var(--warn)}
.t-agent{background:rgba(0,214,190,.15);color:var(--agent)}
.t-run{background:rgba(91,140,255,.16);color:var(--run)}
.t-block{background:rgba(155,135,216,.16);color:var(--violet)}
.t-pending{background:rgba(99,113,143,.16);color:var(--ink-3)}
.muted{color:var(--ink-3)}
.foot{padding:11px 16px;border-top:1px solid var(--hair);font-size:11px;color:var(--ink-3);line-height:1.55}
.foot b{color:var(--gold)}
.tfoot td{font-weight:700;color:var(--ink);background:var(--panel-2);border-top:1px solid var(--hair)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2b{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.mt14{margin-top:14px}
.bar-mini{height:5px;border-radius:3px;background:var(--hair);overflow:hidden;min-width:64px;display:inline-block;vertical-align:middle}
.bar-mini i{display:block;height:100%;border-radius:3px}

/* roll-up to portfolio panel */
.rollup{border:1px solid rgba(241,193,75,.35);background:linear-gradient(180deg,rgba(241,193,75,.05),transparent)}
.rollup .panel-hd{border-bottom-color:rgba(241,193,75,.25)}
.rollup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.rollup-c{text-align:center}
.rollup-c b{display:block;font-size:26px;font-weight:750}
.rollup-c small{color:var(--ink-3);font-size:10px}
.rollup-c .sub{font-size:10px;color:var(--ink-2);margin-top:3px}

/* suites */
.suite{border-bottom:1px solid rgba(38,51,83,.5)}
.suite:last-child{border-bottom:0}
.suite-hd{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.suite-hd:hover{background:var(--panel-2)}
.suite-hd .nm{font-weight:600;font-size:12.5px;flex:1}
.suite-hd .ct{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.suite-ch{display:none;padding:2px 16px 12px 40px}
.suite.open .suite-ch{display:block}
.suite.open .caret{transform:rotate(90deg)}
.caret{color:var(--ink-3);transition:transform .15s;font-size:11px}
.child{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;color:var(--ink-2);border-bottom:1px solid rgba(38,51,83,.35)}
.child:last-child{border-bottom:0}

/* sparkline */
.spark{display:inline-block;vertical-align:middle}

/* agents */
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:15px}
.acard{border:1px solid var(--hair);border-radius:9px;padding:12px 14px;background:var(--panel-2);cursor:pointer}
.acard:hover{border-color:var(--agent)}
.acard .ah{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acard .ah b{font-size:12.5px;font-weight:700}
.acard .ao{font-size:11px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.acard .am{font-size:10px;color:var(--ink-3);margin-top:6px;font-family:var(--mono)}
.statedot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.sd-run{background:var(--run)}.sd-idle{background:var(--ink-3)}.sd-block{background:var(--warn)}

/* portfolio summary */
.gpill{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;font-size:9px;font-weight:700;margin-right:3px;font-family:var(--mono)}
.gpill.g-pass{background:rgba(47,211,154,.18);color:var(--pass)}
.gpill.g-fail{background:rgba(255,84,112,.18);color:var(--fail)}
.gpill.g-warn{background:rgba(245,178,60,.18);color:var(--warn)}
.gpill.g-block{background:rgba(155,135,216,.18);color:var(--violet)}
.gpill.g-pending{background:rgba(99,113,143,.18);color:var(--ink-3)}
.gpills{white-space:nowrap}
.gpills-key{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 13px;font-size:10.5px;color:var(--ink-2)}
.viewbtn{font-size:11px;color:var(--agent);font-weight:700;background:none;border:1px solid var(--hair);border-radius:6px;padding:5px 10px;white-space:nowrap}
.viewbtn:hover{border-color:var(--agent)}

.scrim{position:fixed;inset:0;background:rgba(5,9,17,.66);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,96vw);background:var(--panel);border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.scrim,.drawer{transition:none}}
.drawer-hd{padding:16px 18px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer-hd h3{margin:4px 0 0;font-size:15px;font-weight:700;line-height:1.3}
.drawer-body{padding:18px;overflow:auto;flex:1}
.close{font-size:20px;color:var(--ink-3);line-height:1;padding:2px 6px}.close:hover{color:var(--ink)}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.kv{font-size:11px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--hair);border-radius:6px;padding:5px 9px}
.kv b{color:var(--ink)}
.block{background:var(--panel-2);border:1px solid var(--hair);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.block .lbl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;font-weight:600}
.code{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:pre-wrap;line-height:1.55}
.err{color:var(--fail)}
.empty{padding:26px;text-align:center;color:var(--ink-3)}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid2b{grid-template-columns:1fr}.agrid{grid-template-columns:1fr}.ladder{flex-wrap:wrap}.gate{flex:1 1 30%}}
@media (max-width:900px){.shell{grid-template-columns:1fr}.rail{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--hair)}.mininote{display:none}.field{flex:1 1 150px;margin:0}.kpis{grid-template-columns:repeat(2,1fr)}.rollup-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="brand-mark">GFM</div>
      <div><h1>Agent Delivery Ops</h1><p>Release Assurance</p></div></div>
    <div>
      <label class="field"><span class="eyebrow">Project</span>
        <select id="s-proj"></select></label>
      <label class="field"><span class="eyebrow">Release</span>
        <select id="s-rel" disabled></select></label>
      <label class="field"><span class="eyebrow">Environment</span>
        <select id="s-env" disabled></select></label>
    </div>
    <div class="railcard" id="fleetcard">
      <div class="eyebrow">Test fleet</div>
      <div class="live" title="Assurance agents actively working this project right now (Portfolio view sums this across all six)."><span class="dot"></span><span id="m-run">—</span> agents running</div>
      <div class="rrow" style="margin-top:9px" title="The most recent test run number for this release."><span>Latest run</span><b class="num" id="m-runno">—</b></div>
      <div class="rrow" title="The git commit the latest test run executed against."><span>Commit</span><b class="num" id="m-commit">—</b></div>
      <div class="rrow"><span>Updated</span><b class="num" id="clock">—</b></div>
    </div>
    <div class="mininote" id="mininote"></div>
  </aside>

  <main class="main">
    <div class="crumb" id="crumb"></div>
    <div class="verdict" id="verdict"></div>

    <div class="kpis" id="kpis"></div>

    <div class="ladder" id="ladder" role="group" aria-label="Promotion test gates — select a test gate to filter"></div>

    <div class="tabs" id="tabsbar" role="tablist">
      <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" data-tab="suites" aria-selected="false">Test suites</button>
      <button class="tab" role="tab" data-tab="latency" aria-selected="false">Service latency</button>
      <button class="tab" role="tab" data-tab="failures" aria-selected="false">Failures</button>
      <button class="tab" role="tab" data-tab="agents" aria-selected="false">Agents at work</button>
    </div>
    <div id="filterchip"></div>
    <section id="pane"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail">
  <div class="drawer-hd"><div><div class="eyebrow" id="d-eye">Failure</div><h3 id="d-title">—</h3></div>
    <button class="close" id="d-close" aria-label="Close">&times;</button></div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   Test-gate taxonomy — shared across every project.
   Every project ladder always shows these six, in this order.
   A gate that hasn't been reached yet is status:"pending".
============================================================ */
const GATE_META=[
  {id:"unit", seq:"01", name:"Unit"},
  {id:"comp", seq:"02", name:"Component"},
  {id:"sit",  seq:"03", name:"SIT"},
  {id:"uat",  seq:"04", name:"UAT"},
  {id:"perf", seq:"05", name:"Performance"},
  {id:"sec",  seq:"06", name:"Security"},
];
const GST={pass:["g-pass","Passed"],fail:["g-fail","Failed"],warn:["g-warn","Warnings"],block:["g-block","Blocked"],pending:["g-pending","Not started"]};
const STAMP_COLOR={fail:"var(--fail)",warn:"var(--warn)",pass:"var(--pass)",live:"var(--agent)"};
const STAMP_TAG={fail:"t-fail",warn:"t-warn",pass:"t-pass",live:"t-agent"};

/* helper: build a full 6-gate array from a sparse map, defaulting missing gates to pending */
function gates(map){
  return GATE_META.map(m=>Object.assign({id:m.id,seq:m.seq,name:m.name,total:0,fail:0,skip:0,dur:"—",status:"pending"},map[m.id]||{}));
}

/* ============================================================
   Per-project mock data. Numbers for phase/quality/override/
   escape are carried over from the portfolio console (Agent
   Delivery Operations dashboard) so the two stay consistent.
============================================================ */
const PROJECTS={

 "AOE-OPT":{
  name:"AOE Optimization", code:"AOE-OPT", lead:"FX Pricing Tribe",
  release:"r2026.07.2 (build increment)", env:"SIT-2 → UAT-1", runNo:"#4,182", commit:"a91f4c7",
  phase:"Build", pct:62, agentsRunning:5,
  qc:{qcPass:97.6, override:3.8, escape:0.11, manualBase:94.0, artifacts:1840, overridden:70},
  stampLabel:"Blocked · CAB", stampTone:"fail",
  verdictHead:'Release <em>blocked at the Component test gate</em> — 5 agent fixes await human approval',
  verdictBody:"The test fleet ran 13,515 cases against commit a91f4c7. Twenty-three failed, resolving to nine root-cause items: agents have proposed fixes for five, are still investigating two, and have escalated two that need a human scope decision. No fix ships without a human approving the pull request.",
  gates:gates({
    unit:{total:8412, fail:0,  skip:12, dur:"4m 11s",  status:"pass"},
    comp:{total:3164, fail:6,  skip:9,  dur:"11m 02s", status:"fail"},
    sit: {total:1287, fail:11, skip:14, dur:"38m 47s", status:"fail"},
    uat: {total:342,  fail:3,  skip:6,  dur:"—",       status:"block"},
    perf:{total:96,   fail:2,  skip:0,  dur:"22m 30s", status:"warn"},
    sec: {total:214,  fail:1,  skip:0,  dur:"6m 58s",  status:"fail"},
  }),
  suites:[
    {gate:"unit",name:"Pricing kernel",total:2841,fail:0,dur:"1m 22s",ch:[["Volatility surface interpolation",914,0],["Discount curve bootstrap",702,0],["Day-count conventions",1225,0]]},
    {gate:"unit",name:"Trade model",total:3105,fail:0,dur:"1m 40s",ch:[["FX spot / forward",1180,0],["NDF lifecycle",842,0],["Swap leg generation",1083,0]]},
    {gate:"unit",name:"Reference data",total:2466,fail:0,dur:"1m 09s",ch:[["Currency pair master",981,0],["Holiday calendars",744,0],["Counterparty static",741,0]]},
    {gate:"comp",name:"Quote router",total:1204,fail:4,dur:"4m 18s",ch:[["Venue failover",318,3],["Spread laddering",442,0],["Quote throttling",444,1]]},
    {gate:"comp",name:"Murex trade adapter",total:1108,fail:2,dur:"3m 51s",ch:[["Booking message mapping",520,2],["Amend / cancel replay",588,0]]},
    {gate:"comp",name:"Limit check",total:852,fail:0,dur:"2m 53s",ch:[["Pre-trade credit limit",430,0],["Notional cap",422,0]]},

/* ---- sparkline ---- */
function spark(vals,slo,w=90,h=22){
  const max=Math.max(...vals,slo),min=Math.min(...vals);
  const X=i=>i/(vals.length-1)*w, Y=v=>h-2-((v-min)/((max-min)||1))*(h-4);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const breach=vals[vals.length-1]>slo;
  const sloY=Y(slo).toFixed(1);
  return `<svg class="spark" width="${w}" height="${h}"><line x1="0" y1="${sloY}" x2="${w}" y2="${sloY}" stroke="var(--hair)" stroke-dasharray="2 2"/><polyline points="${pts}" fill="none" stroke="${breach?'var(--fail)':'var(--pass)'}" stroke-width="1.5"/></svg>`;
}

  return `<div class="panel"><div class="panel-hd" title="Test suites group individual test cases by feature area. Click a suite to expand its child cases."><h3>Test suites${state.gate?" · "+p.gates.find(g=>g.id===state.gate).name+" test gate":""}</h3><span class="slo">${list.length} suites · select a row to expand</span></div>
    <div>${list.map((s,i)=>`<div class="suite" data-suite="${i}">
      <div class="suite-hd"><span class="caret">▶</span><span class="nm">${esc(s.name)}</span>
        <span class="ct">${s.total.toLocaleString()} cases</span>
        <span class="tag ${s.fail?'t-fail':'t-pass'}">${s.fail?s.fail+" failed":"all passed"}</span>
        <span class="ct">${s.dur}</span></div>
      <div class="suite-ch">${s.ch.map(([n,t,f])=>`<div class="child"><span>${esc(n)}</span><span class="num">${t} cases · <span class="${f?'failc':'passc'}">${f?f+" failed":"pass"}</span></span></div>`).join("")}</div></div>`).join("")}</div></div>`;
}
function paneLatency(p){
  const {key,dir}=state.sort;
  const services=p.services.filter(s=>!state.gate||s.gate===state.gate);
  if(!services.length) return `<div class="panel"><div class="empty">No services under test${state.gate?" in the "+p.gates.find(g=>g.id===state.gate).name+" test gate":""} yet.</div></div>`;
  const breaches=services.filter(s=>s.p99>s.slo).length;
  const rows=[...services].sort((a,b)=>(a[key]-b[key])*dir).map(s=>{const breach=s.p99>s.slo;
    return `<tr><td class="mono">${esc(s.name)}</td><td class="r num">${s.p50}</td><td class="r num">${s.p95}</td>
      <td class="r num ${breach?'failc':''}">${s.p99}</td><td class="r num muted">${s.slo}</td>
      <td class="r num ${s.err>0.1?'failc':s.err>0?'warnc':'muted'}">${s.err.toFixed(2)}%</td>
      <td class="r">${spark(s.spark,s.slo)}</td>
      <td class="r"><span class="tag ${breach?'t-fail':'t-pass'}">${breach?'SLO breach':'within SLO'}</span></td></tr>`;}).join("");
  const th=(k,l,tip)=>`<th class="r sortable" data-sort="${k}"${tip?` title="${esc(tip)}"`:""}>${l}${key===k?(dir<0?" ↓":" ↑"):""}</th>`;
  return `<div class="panel"><div class="panel-hd" title="Latency of each service exercised by this project's test suite, measured during test execution."><h3>Service latency under test${state.gate?" · "+p.gates.find(g=>g.id===state.gate).name+" test gate":""}</h3><span class="slo">${breaches} of ${services.length} services breaching p99 SLO · ms</span></div>
    <table><thead><tr><th>Service</th>${th("p50","p50","Median response time — half of requests are faster than this.")}${th("p95","p95","95th-percentile response time.")}${th("p99","p99","99th-percentile response time — the tail latency compared against the SLO.")}<th class="r" title="The p99 objective this service is held to.">SLO</th>${th("err","Error","Error rate observed during the test run.")}<th class="r" title="p99 trend over the last several runs, against the SLO (dashed line).">Trend</th><th class="r" title="Whether the latest p99 sits within or breaches the SLO.">Status</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot">Services are tagged to the test gate that exercises them, so filtering by gate above narrows this list too.</div></div>`;
}
function paneFailures(p){
  const list=p.failures.filter(f=>!state.gate||f.gate===state.gate);
  if(!list.length){
    const msg=state.gate?`No failures in the ${p.gates.find(g=>g.id===state.gate).name} test gate. Clear the filter to see the others.`:"No open failures on this release.";
    return `<div class="panel"><div class="empty">${msg}</div></div>`;
  }
  return `<div class="panel"><div class="panel-hd" title="Root-cause failure items, each of which can span several failing test cases. Click a row for the agent's full triage notes."><h3>Failures${state.gate?" · "+p.gates.find(g=>g.id===state.gate).name+" test gate":""}</h3><span class="slo">${list.length} items · select one for the agent's triage</span></div>
    <table><thead><tr><th>ID</th><th>Test</th><th title="The agent role — or Human, for a scope decision — currently responsible for resolving this.">Owner</th><th class="r" title="Fix proposed = a pull request awaits approval. Investigating = root cause not yet found. Needs decision = requires a human scope call.">State</th></tr></thead>
    <tbody>${list.map(f=>{const cls=f.state==="fix proposed"?"t-agent":f.state==="investigating"?"t-run":"t-warn";
      return `<tr class="clickable" data-fail="${f.id}"><td class="mono">${f.id}</td><td><div style="font-weight:600">${esc(f.test)}</div><div class="muted" style="font-size:10.5px">${esc(f.suite)}</div></td><td style="font-size:11.5px">${esc(f.owner)}</td><td class="r"><span class="tag ${cls}">${f.state}</span></td></tr>`;}).join("")}</tbody></table></div>`;
}
function paneAgents(p){
  const agents=buildAgents(p);
  return `<div class="panel"><div class="panel-hd" title="The subset of the delivery fleet doing test & release-assurance work on this project. Click a card for detail."><h3>Assurance agents on this release</h3><span class="slo">a subset of the 40-agent delivery fleet, scoped to test &amp; release</span></div>
    <div class="agrid">${agents.map(a=>`<div class="acard" data-agent="${esc(a.name)}" title="${a.state==='running'?'Running':a.state==='block'?'Blocked':'Idle'} · ${esc(a.runs)} · last active ${a.last}"><div class="ah"><b>${esc(a.name)}</b><span class="statedot sd-${a.state==='running'?'run':a.state==='block'?'block':'idle'}"></span></div><div class="ao">${esc(a.out)}</div><div class="am">${esc(a.runs)} · last ${a.last}</div></div>`).join("")}</div>
    <div class="foot">These are the same named agents that appear on the portfolio console's fleet — here you see them working ${esc(p.name)}. The Debug &amp; Remediation, Refactoring &amp; Performance and Security &amp; Vulnerability agents propose changes; a human approves every pull request before it merges.</div></div>`;
}
function buildAgents(p){
  const byState=st=>p.failures.filter(f=>f.state===st).length;
  const fixProposed=byState("fix proposed"), investigating=byState("investigating"), needsDecision=byState("needs decision");
  const totCases=p.gates.reduce((a,g)=>a+g.total,0);
  const lastGate=[...p.gates].reverse().find(g=>g.total>0)||p.gates[0];
  const perfGate=p.gates.find(g=>g.id==="perf"), secGate=p.gates.find(g=>g.id==="sec");
  return [
    {name:"Test Script Agent",runs:Math.max(40,Math.round(totCases*0.02))+" cases authored",last:"08:14 SGT",state:p.pct<100?"running":"idle",out:`Authoring and maintaining the ${esc(p.name)} regression pack from Jira stories and NFRs.`},
    {name:"Test Data Agent",runs:Math.round(p.qc.artifacts*0.6)+" artifacts masked",last:"08:41 SGT",state:"idle",out:`Provisioned masked test data for ${esc(p.env)}, within MAS data-handling rules.`},
    {name:"Test Execution Agent",runs:totCases.toLocaleString()+" executed",last:"11:02 SGT",state:"running",out:`Executing the ${esc(lastGate.name)} test gate pack against ${esc(p.env)}.`},
    {name:"Debug & Remediation Agent",runs:fixProposed+" fixes proposed",last:"11:19 SGT",state:(fixProposed+investigating)?"running":"idle",out:`${fixProposed} pull request${fixProposed===1?"":"s"} open, ${investigating} failure${investigating===1?"":"s"} still under investigation, ${needsDecision} escalated to humans for a scope decision.`},
    {name:"Refactoring & Performance Agent",runs:p.failures.filter(f=>f.owner==="Refactoring & Performance Agent").length+" hotspots found",last:"10:47 SGT",state:perfGate.total?"running":"idle",out:perfGate.fail?`Profiling the ${esc(p.name)} performance test gate; fix proposed for the current SLO breach.`:`No open performance regressions on ${esc(p.name)} right now.`},
    {name:"Security & Vulnerability Agent",runs:secGate.total+" checks",last:"09:58 SGT",state:secGate.fail?"running":"idle",out:secGate.fail?`${secGate.fail} advisory item${secGate.fail===1?"":"s"} open · fix pinned and verified against regression.`:"No open security advisories on this release."},
    {name:"Test Reporting Agent",runs:"this console",last:"11:20 SGT",state:"running",out:`Compiling the ${esc(p.name)} gate verdict and the QC roll-up that feeds the portfolio Output Quality tab.`},
    {name:"Compliance & Evidence Agent",runs:"evidence pack",last:"11:20 SGT",state:p.stampTone==="fail"||p.stampTone==="warn"?"block":"idle",out:p.stampTone==="live"?`Evidence pack sealed; ${esc(p.name)} is in pilot.`:`Waiting on the remaining test gates to clear before the ${esc(p.name)} CAB evidence pack can be sealed.`},
  ];
}
const PANES={overview:paneOverview,suites:paneSuites,latency:paneLatency,failures:paneFailures,agents:paneAgents};

/* ---- portfolio summary pane ---- */
function panePortfolioSummary(){
  const rows=PROJECT_ORDER.map(code=>{
    const p=PROJECTS[code];
    const pills=p.gates.map(g=>{const s=GST[g.status];return `<span class="gpill ${s[0]}" title="${esc(g.name)} test gate · ${s[1]}">${g.seq}</span>`;}).join("");
    const totFail=p.gates.reduce((a,g)=>a+g.fail,0);
    return `<tr class="clickable" data-viewproject="${code}">
      <td><div style="font-weight:600">${esc(p.name)}</div><div class="muted mono" style="font-size:10px">${p.code} · ${esc(p.lead)}</div></td>
      <td><span style="font-size:10px;color:var(--ink-2)">${p.phase} · ${p.pct}%</span></td>
      <td class="gpills">${pills}</td>
      <td class="r num ${totFail?'failc':'passc'}">${totFail}</td>
      <td class="r num">${p.qc.qcPass.toFixed(1)}%</td>
      <td class="r"><span class="tag ${STAMP_TAG[p.stampTone]}">${esc(p.stampLabel)}</span></td>
      <td class="r"><button class="viewbtn" data-viewproject="${code}">View →</button></td>
    </tr>`;
  }).join("");
  return `<div class="panel"><div class="panel-hd" title="One row per project. Hover the gate pills for each gate's status, or click a row to open that project's full console."><h3>All projects — test gate status</h3><span class="slo">click a project for its full release-assurance console</span></div>
    <table><thead><tr><th>Project</th><th title="Current lifecycle phase and build completion.">Phase</th><th title="01 Unit · 02 Component · 03 SIT · 04 UAT · 05 Performance · 06 Security — hover a pill for its status.">Test gates (01–06)</th><th class="r" title="Sum of failing test cases across all six gates.">Open defects</th><th class="r" title="Quality-control pass rate of this project's agent output.">QC pass</th><th class="r" title="Overall promotion verdict for this release.">Verdict</th><th class="r"></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="gpills-key"><span><span class="gpill g-pass">01</span>Passed</span><span><span class="gpill g-fail">•</span>Failed</span><span><span class="gpill g-warn">•</span>Warnings</span><span><span class="gpill g-block">•</span>Blocked</span><span><span class="gpill g-pending">•</span>Not started</span></div>
    <div class="foot">Test gates, left to right: 01 Unit · 02 Component · 03 SIT · 04 UAT · 05 Performance · 06 Security. Every project runs the same six; a project that hasn't reached a gate yet shows it as "not started" rather than passed.</div></div>`;
}

/* ---- top-level render ---- */
function render(){
  renderChip();
  if(state.view==="portfolio"){
    $("#tabsbar").style.display="none";
    $("#pane").innerHTML=panePortfolioSummary();
  }else{
    $("#tabsbar").style.display="";
    const p=cur();
    $("#pane").innerHTML=PANES[state.tab](p);
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===state.tab)));
  }
}
function renderAll(){
  renderProjectSelect();renderSidebar();renderCrumbVerdict();renderKpis();renderLadder();render();
}
function switchProject(codeOrPortfolio){
  if(codeOrPortfolio==="PORTFOLIO"){state.view="portfolio";}
  else{state.view="project";state.project=codeOrPortfolio;}
  state.gate=null;state.tab="overview";
  renderAll();
}

/* ---- drawer ---- */
function openDrawer(eye,title,body){$("#d-eye").textContent=eye;$("#d-title").textContent=title;$("#d-body").innerHTML=body;$("#drawer").classList.add("open");$("#scrim").classList.add("open");$("#d-close").focus();}
function closeDrawer(){$("#drawer").classList.remove("open");$("#scrim").classList.remove("open");}
function failDrawer(f){
  const cls=f.state==="fix proposed"?"t-agent":f.state==="investigating"?"t-run":"t-warn";
  openDrawer("Failure · "+f.id,f.test,
    `<div class="dmeta"><span class="kv">Suite <b>${esc(f.suite)}</b></span><span class="kv">Owner <b>${esc(f.owner)}</b></span><span class="kv">First seen <b>${esc(f.first)}</b></span><span class="tag ${cls}" style="align-self:center">${f.state}</span></div>
     <div class="block"><div class="lbl">Assertion</div><div class="code err">${esc(f.err)}</div></div>
     <div class="block"><div class="lbl">Stack / context</div><div class="code">${esc(f.stack)}</div></div>
     <div class="block"><div class="lbl">Agent triage</div><div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">${esc(f.note)}</div></div>
     <div class="block" style="border-color:rgba(0,214,190,.3)"><div class="lbl" style="color:var(--agent)">Proposed action</div><div class="code" style="color:var(--ink)">${esc(f.pr)}</div></div>`);
}
function agentDrawer(a){
  openDrawer("Agent",a.name,
    `<div class="dmeta"><span class="kv">State <b>${a.state==='running'?'Running':a.state==='block'?'Blocked':'Idle'}</b></span><span class="kv">Activity <b>${esc(a.runs)}</b></span><span class="kv">Last <b>${a.last}</b></span></div>
     <div class="block"><div class="lbl">Current output</div><div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">${esc(a.out)}</div></div>
     <div class="foot" style="border:0;padding:0">Part of the 40-agent delivery fleet shown on the portfolio console. On this release it works the assurance stage of the lifecycle; its output rolls up into the release verdict above.</div>`);
}

/* ---- events ---- */
$("#s-proj").addEventListener("change",e=>switchProject(e.target.value));
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-gate]");
  if(g){state.gate=state.gate===g.dataset.gate?null:g.dataset.gate;renderLadder();render();return;}
  const cf=e.target.closest("#clearf");if(cf){state.gate=null;renderLadder();render();return;}
  const tab=e.target.closest(".tab");if(tab){state.tab=tab.dataset.tab;render();return;}
  const su=e.target.closest("[data-suite]");if(su){su.classList.toggle("open");return;}
  const th=e.target.closest("[data-sort]");if(th){const k=th.dataset.sort;state.sort={key:k,dir:state.sort.key===k?-state.sort.dir:-1};render();return;}
  const fl=e.target.closest("[data-fail]");if(fl){failDrawer(cur().failures.find(x=>x.id===fl.dataset.fail));return;}
  const ag=e.target.closest("[data-agent]");if(ag){agentDrawer(buildAgents(cur()).find(x=>x.name===ag.dataset.agent));return;}
  const vp=e.target.closest("[data-viewproject]");if(vp){switchProject(vp.dataset.viewproject);return;}
  if(e.target.closest("#d-close")||e.target.id==="scrim")closeDrawer();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
function tick(){$("#clock").textContent=new Date().toLocaleTimeString("en-GB",{hour12:false})+" SGT";}
tick();setInterval(tick,1000);
renderAll();
</script>
</body>
</html>
